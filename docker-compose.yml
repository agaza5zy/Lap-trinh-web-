services:
  mysql:
    image: mysql:8.4
    container_name: vnhotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vnhotel_dev_password
      MYSQL_DATABASE: hotel_booking
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - vnhotel_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvnhotel_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  vnhotel_mysql_data:
